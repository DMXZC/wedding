<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Gallery</title>
<style>
  body {
    margin: 0;
    padding: 40px 20px;
    background: #e9e9e9;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 480px;
    max-width: 100%;
    box-shadow: 0 4px 24px rgba(0,0,0,0.15);
  }
  .card img {
    display: block;
    width: 100%;
  }
  /* bridges the color gap between two adjacent images so the seam disappears */
  .seam {
    height: 32px;
  }
  .seam--1-2 {
    background: linear-gradient(to bottom, rgb(254,253,253), rgb(254,250,230));
  }
</style>
</head>
<body>
  <div class="card">
    <img src="image/1.png" alt="1">
    <div class="seam seam--1-2"></div>
    <img src="image/2.png" alt="2">
    <img src="image/3.png" alt="3">
    <img src="image/4.png" alt="4">
  </div>
</body>
</html>
